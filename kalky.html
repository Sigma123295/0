<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор с частицами</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: auto;
      font-family: Arial, sans-serif;
    }
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .container {
      position: relative;
      min-height: 100vh;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
    }
    #calc {
      width: 320px;
      margin: 30px auto 30px;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 15px;
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
    }
    #display {
      width: 100%;
      height: 40px;
      font-size: 20px;
      text-align: right;
      margin-bottom: 10px;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #666;
    }
    button {
      width: 60px;
      height: 50px;
      margin: 4px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 5px;
      border: 1px solid #666;
      background: rgba(255,255,255,0.3);
      color: #fff;
    }
    button:hover {
      background: rgba(255,255,255,0.5);
    }

    #equation {
      width: 320px;
      margin: 30px auto 50px;
      padding: 15px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
    }
    .row {
      margin: 10px 0;
      text-align: left;
    }
    .row label {
      width: 60px;
      display: inline-block;
    }
    .row input {
      width: 80px;
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #666;
    }
    .row button {
      width: 100px;
      margin-left: 5px;
    }
    #eq-result {
      margin-top: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="container">

    <!-- Калькулятор -->
    <div id="calc">
      <input type="text" id="display" value="0" disabled />

      <div>
        <button onclick="clearAll()">C</button>
        <button onclick="back()">←</button>
        <button onclick="input('+')">+</button>
        <button onclick="input('-')">−</button>
      </div>

      <div>
        <button onclick="input('7')">7</button>
        <button onclick="input('8')">8</button>
        <button onclick="input('9')">9</button>
        <button onclick="input('*')">×</button>
      </div>

      <div>
        <button onclick="input('4')">4</button>
        <button onclick="input('5')">5</button>
        <button onclick="input('6')">6</button>
        <button onclick="input('/')">÷</button>
      </div>

      <div>
        <button onclick="input('1')">1</button>
        <button onclick="input('2')">2</button>
        <button onclick="input('3')">3</button>
        <button onclick="input('0')">0</button>
      </div>

      <div>
        <button onclick="input('.')">.</button>
        <button onclick="calculate()" style="width: 130px;">=</button>
      </div>
    </div>

    <!-- Уравнения внизу -->
    <div id="equation">
      <h3>Решение уравнения</h3>
      <p>Введите уравнение вида <code>ax + b = c</code></p>

      <div class="row">
        <label>a =</label>
        <input type="number" id="a" value="1">
      </div>
      <div class="row">
        <label>b =</label>
        <input type="number" id="b" value="0">
      </div>
      <div class="row">
        <label>c =</label>
        <input type="number" id="c" value="0">
      </div>
      <div class="row">
        <button onclick="solveEquation()">Решить</button>
      </div>
      <div id="eq-result"></div>
    </div>

  </div>

  <script>
    // Калькулятор
    const display = document.getElementById("display");

    function input(value) {
      if (display.value === "0") {
        display.value = value;
      } else {
        display.value += value;
      }
    }

    function clearAll() {
      display.value = "0";
    }

    function back() {
      if (display.value.length === 1) {
        display.value = "0";
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function calculate() {
      try {
        const result = eval(display.value.replace(/×/g, "*").replace(/÷/g, "/"));
        display.value = result.toString();
      } catch (e) {
        display.value = "Ошибка";
      }
    }

    // Партиклы
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];
    const particleCount = 60;

    function init() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          speedX: (Math.random() - 0.5) * 0.7,
          speedY: (Math.random() - 0.5) * 0.7,
          color: `hsl(${Math.random() * 360}, 80%, 60%)`
        });
      }
      animate();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      requestAnimationFrame(animate);
    }
    window.addEventListener("resize", init);
    init();

    // Решение уравнения ax + b = c
    function solveEquation() {
      const a = parseFloat(document.getElementById("a").value);
      const b = parseFloat(document.getElementById("b").value);
      const c = parseFloat(document.getElementById("c").value);
      const resultDiv = document.getElementById("eq-result");

      if (isNaN(a) || isNaN(b) || isNaN(c)) {
        resultDiv.innerHTML = "Все поля должны быть числами.";
        return;
      }

      if (a === 0) {
        if (b === c) {
          resultDiv.innerHTML = `Уравнение верно при любом x.`;
        } else {
          resultDiv.innerHTML = `Нет решений: 0·x + ${b} ≠ ${c}.`;
        }
        return;
      }

      const x = (c - b) / a;
      resultDiv.innerHTML = `Уравнение: ${round(a)}·x + ${round(b)} = ${round(c)}<br>Решение: x = ${round(x, 4)}`;
    }

    function round(num, digits = 2) {
      const f = Math.pow(10, digits);
      return Math.round(num * f) / f;
    }
  </script>
</body>
</html>
