  <style>
:root {
  --bg: #120218;
  --bg2: #24112f;
  --card: rgba(42, 16, 58, 0.88);
  --line: rgba(255, 120, 210, 0.28);
  --pink: #ff4db8;
  --pink2: #ff87d0;
  --violet: #9b6bff;
  --cyan: #5ce1ff;
  --gold: #ffd15a;
  --text: #fff7fb;
  --muted: #c9b3d4;
  --her: linear-gradient(135deg, #ff4db8, #c44dff);
  --me: linear-gradient(135deg, #3aa0ff, #6d7bff);
  --safe: env(safe-area-inset-top, 0px);
  --safeb: env(safe-area-inset-bottom, 0px);
  --navh: 64px;
  --toph: 56px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: #07010b; color: var(--text);
  font-family: "Segoe UI", "Nunito", "Trebuchet MS", sans-serif;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; touch-action: manipulation;
}
img { -webkit-user-drag: none; pointer-events: none; }
button, .tap { cursor: pointer; font: inherit; color: inherit; }
#app {
  position: relative; width: 100%; height: 100%; margin: 0 auto;
  max-width: min(100vw, calc(100vh * 2));
  max-height: min(100vh, calc(100vw * 2));
  background:
    radial-gradient(1200px 500px at 10% -10%, #5a1a7a 0%, transparent 55%),
    radial-gradient(900px 500px at 110% 10%, #1a4d7a 0%, transparent 50%),
    linear-gradient(180deg, #1a0824 0%, #120218 45%, #09010f 100%);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.hidden { display: none !important; }
.boot {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end; z-index: 20;
}
.boot-hero { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.boot-glow { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, #120218 78%); }
.boot-copy { position: relative; z-index: 2; text-align: center; padding: 0 20px 48px; width: 100%; }
.boot-kicker { letter-spacing: .28em; text-transform: uppercase; color: var(--pink2); font-size: 12px; margin: 0 0 8px; }
.boot h1 { margin: 0; font-size: clamp(28px, 7vw, 44px); text-shadow: 0 8px 30px #000; }
.boot-sub { color: var(--cyan); margin: 8px 0 18px; }
.boot-bar { width: 180px; height: 6px; margin: 0 auto; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
.boot-bar i { display: block; height: 100%; width: 30%; background: linear-gradient(90deg, var(--pink), var(--cyan)); animation: load 1.2s ease infinite; }
@keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }

.view { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.topbar {
  height: calc(var(--toph) + var(--safe));
  padding: var(--safe) 12px 0;
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  background: linear-gradient(180deg, rgba(18,2,24,.92), rgba(18,2,24,.55));
}
.topbar h2 { flex: 1; margin: 0; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn, .coin-chip, .pill {
  border: 1px solid var(--line); background: rgba(255,255,255,.06);
  border-radius: 999px; min-height: 40px; min-width: 40px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 12px;
}
.icon-btn { font-size: 18px; }
.coin-chip { color: var(--gold); font-weight: 700; }
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  touch-action: pan-y;
  padding: 12px 14px calc(var(--navh) + var(--safeb) + 16px);
}
.scroll::-webkit-scrollbar { width: 6px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(255,77,184,.45); border-radius: 99px; }

.nav {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: calc(var(--navh) + var(--safeb));
  padding-bottom: var(--safeb);
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(12, 2, 18, .92); border-top: 1px solid var(--line);
  backdrop-filter: blur(12px);
}
.nav button {
  background: none; border: 0; color: var(--muted); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: 11px;
}
.nav button.on { color: #fff; text-shadow: 0 0 12px var(--pink); }
.nav b { font-size: 18px; font-weight: 700; }

.hero-card {
  position: relative; border-radius: 22px; overflow: hidden; height: 210px;
  border: 1px solid var(--line); margin-bottom: 14px;
}
.hero-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-card .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent, #16041fd9 78%); }
.hero-card .copy { position: absolute; left: 14px; right: 14px; bottom: 12px; }
.hero-card h3 { margin: 0 0 4px; font-size: 22px; }
.badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 3px 8px; font-size: 11px; }
.badge.hot { background: #ff2d7a; border: 0; font-weight: 800; }
.badge.gold { background: var(--gold); color: #3a2200; font-weight: 800; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 12px; display: flex; gap: 10px; align-items: center;
}
.card.col { flex-direction: column; align-items: stretch; }
.avatar {
  width: 58px; height: 58px; border-radius: 16px; object-fit: cover; flex-shrink: 0;
  border: 2px solid var(--pink2); box-shadow: 0 0 16px rgba(255,77,184,.35);
}
.online { width: 10px; height: 10px; background: #39ff95; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #39ff95; }
.muted { color: var(--muted); font-size: 13px; }
.btn {
  border: 0; border-radius: 16px; min-height: 48px; padding: 0 16px; font-weight: 800;
  background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff;
  box-shadow: 0 8px 22px rgba(255,77,184,.28);
}
.btn.sec { background: rgba(255,255,255,.08); border: 1px solid var(--line); box-shadow: none; }
.btn.gold { background: linear-gradient(135deg, #ffd15a, #ff9a3c); color: #3a2200; }
.btn.cyan { background: linear-gradient(135deg, #5ce1ff, #6d7bff); }
.btn:disabled { opacity: .5; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

.chat-list .card { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); }
.preview { color: var(--pink2); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.messages { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
.bubble {
  max-width: 82%; padding: 10px 12px; border-radius: 16px; line-height: 1.35; font-size: 15px;
  word-wrap: break-word;
}
.bubble.her { align-self: flex-start; background: var(--her); border-bottom-left-radius: 4px; }
.bubble.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.choice {
  text-align: left; background: rgba(255,255,255,.07); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px; min-height: 46px;
}
.choice:hover, .choice:focus { outline: 0; border-color: var(--cyan); }

.photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.photo-card { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 3/4; border: 1px solid var(--line); }
.photo-card img { width: 100%; height: 100%; object-fit: cover; }
.photo-card.locked img { filter: blur(16px) saturate(1.2); transform: scale(1.08); }
.photo-card .meta {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 8px;
  background: linear-gradient(180deg, transparent, #000c);
  display: flex; justify-content: space-between; align-items: flex-end; gap: 6px;
}
.lock-ico { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 28px; }

.q-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.progress { height: 8px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--cyan)); }
.answers { display: flex; flex-direction: column; gap: 8px; }
.answer { text-align: left; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.06); padding: 12px; }

.result { text-align: center; padding: 12px 6px 20px; }
.result .big { font-size: 28px; margin: 8px 0; }
.stars { color: var(--gold); font-size: 22px; letter-spacing: 3px; }

.toast {
  position: absolute; left: 50%; bottom: calc(var(--navh) + 18px); transform: translateX(-50%);
  background: #22102d; border: 1px solid var(--line); padding: 10px 14px; border-radius: 14px;
  z-index: 30; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
}
.modal {
  position: absolute; inset: 0; background: rgba(5,0,10,.72); display: flex; align-items: flex-end;
  justify-content: center; z-index: 40; padding: 16px;
}
.modal-card {
  width: min(460px, 100%); background: #24112f; border: 1px solid var(--line);
  border-radius: 22px; padding: 16px; margin-bottom: var(--safeb);
}
.viewer { align-items: center; }
.viewer img { width: min(420px, 100%); max-height: 70%; object-fit: contain; border-radius: 12px; }
.pause {
  position: absolute; inset: 0; background: rgba(6,0,12,.82); display: flex; align-items: center;
  justify-content: center; z-index: 50;
}
.pause-card { text-align: center; }
.section-title { margin: 4px 0 10px; font-size: 16px; color: var(--cyan); }
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.stat { background: rgba(255,255,255,.06); border-radius: 14px; padding: 12px; text-align: center; }
.stat b { display: block; font-size: 22px; color: var(--gold); }

@media (min-width: 820px) {
  .photo-grid { grid-template-columns: repeat(4, 1fr); }
  .grid-2 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .hero-card { height: 280px; }
  .scroll { padding-left: 22px; padding-right: 22px; }
  .chat-col { display: grid !important; grid-template-columns: 1fr 1fr; gap: 8px !important; }
}
@media (max-width: 380px) {
  .nav button { font-size: 10px; }
  .avatar { width: 50px; height: 50px; }
}

const AudioFX = (() => {
  let ctx = null, master, musicGain, sfxGain, musicNodes = [];
  let musicOn = true, sfxOn = true, running = false;

  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      ctx = new C();
      master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = 0.18; musicGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function beep(freq, dur, type, vol, when) {
    const c = ac();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + (when || 0));
    g.gain.exponentialRampToValueAtTime(vol || 0.2, c.currentTime + (when || 0) + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + (when || 0) + dur);
    o.connect(g); g.connect(sfxGain);
    o.start(c.currentTime + (when || 0));
    o.stop(c.currentTime + (when || 0) + dur + 0.02);
  }

  function click() { if (!sfxOn) return; beep(720, 0.06, "triangle", 0.12); beep(980, 0.05, "sine", 0.08, 0.02); }
  function coin() { if (!sfxOn) return; beep(880, 0.08, "square", 0.1); beep(1320, 0.12, "sine", 0.12, 0.06); }
  function message() { if (!sfxOn) return; beep(420, 0.09, "sine", 0.1); beep(640, 0.1, "triangle", 0.08, 0.04); }
  function success() { if (!sfxOn) return; beep(523, 0.1, "sine", 0.1); beep(659, 0.12, "sine", 0.1, 0.08); beep(784, 0.16, "sine", 0.12, 0.16); }

  function startPad() {
    const c = ac();
    stopPad();
    const notes = [196, 247, 294, 330, 392];
    notes.forEach((n, i) => {
      const o = c.createOscillator();
      const g = c.createGain();
      const f = c.createBiquadFilter();
      o.type = i % 2 ? "sine" : "triangle";
      o.frequency.value = n;
      f.type = "lowpass"; f.frequency.value = 900;
      g.gain.value = 0.07;
      const lfo = c.createOscillator();
      const lg = c.createGain();
      lfo.frequency.value = 0.04 + i * 0.015;
      lg.gain.value = 18;
      lfo.connect(lg); lg.connect(o.frequency);
      o.connect(f); f.connect(g); g.connect(musicGain);
      o.start(); lfo.start();
      musicNodes.push(o, lfo, g);
    });
    running = true;
  }
  function stopPad() {
    musicNodes.forEach((n) => { try { n.stop && n.stop(); } catch (e) {} });
    musicNodes = [];
    running = false;
  }

  return {
    unlock() { ac(); },
    click, coin, message, success,
    setMusic(v) { musicOn = v; if (musicGain) musicGain.gain.value = v && !this._paused ? 0.18 : 0; if (v && !running && !this._paused) startPad(); if (!v) stopPad(); },
    setSfx(v) { sfxOn = v; },
    pauseAll() {
      this._paused = true;
      if (musicGain) musicGain.gain.value = 0;
      if (sfxGain) sfxGain.gain.value = 0;
      if (ctx && ctx.state === "running") ctx.suspend();
    },
    resumeAll() {
      this._paused = false;
      if (ctx) ctx.resume();
      if (sfxGain) sfxGain.gain.value = sfxOn ? 0.55 : 0;
      if (musicOn) {
        if (musicGain) musicGain.gain.value = 0.18;
        if (!running) startPad();
      }
    },
    isMusic() { return musicOn; },
    isSfx() { return sfxOn; }
  };
})();

const Platform = {
  ysdk: null,
  player: null,
  local: true,
  paused: false,
  gameplay: false,
  readySent: false,

  async init() {
    if (location.protocol === "file:") {
      this.local = true;
      this.ysdk = this._mock();
      return this.ysdk;
    }
    const waitYa = () => new Promise((resolve) => {
      if (window.YaGames) return resolve(true);
      let n = 0;
      const id = setInterval(() => {
        n++;
        if (window.YaGames) { clearInterval(id); resolve(true); }
        else if (n > 20) { clearInterval(id); resolve(false); }
      }, 80);
    });
    const has = await waitYa();
    if (!has) {
      this.local = true;
      this.ysdk = this._mock();
      return this.ysdk;
    }
    this.ysdk = await YaGames.init();
    this.local = false;
    this.ysdk.on("game_api_pause", () => this.onPause());
    this.ysdk.on("game_api_resume", () => this.onResume());
    if (this.ysdk.EVENTS) {
      this.ysdk.on(this.ysdk.EVENTS.ACCOUNT_SELECTION_DIALOG_CLOSED, () => {
        location.reload();
      });
    }
    try { this.player = await this.ysdk.getPlayer(); } catch (e) { this.player = null; }
    try {
      const st = await this.ysdk.adv.getBannerAdvStatus();
      if (!st.stickyAdvIsShowing) this.ysdk.adv.showBannerAdv();
    } catch (e) {}
    return this.ysdk;
  },

  lang() {
    try {
      return (this.ysdk && this.ysdk.environment && this.ysdk.environment.i18n.lang) || navigator.language || "ru";
    } catch (e) { return "ru"; }
  },

  isMobile() {
    try {
      const d = this.ysdk && this.ysdk.deviceInfo;
      if (d) return !!(d.isMobile || d.isTablet);
    } catch (e) {}
    return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  },

  ready() {
    if (this.readySent) return;
    this.readySent = true;
    try { this.ysdk.features.LoadingAPI.ready(); } catch (e) {}
  },

  startGameplay() {
    if (this.gameplay) return;
    this.gameplay = true;
    try { this.ysdk.features.GameplayAPI.start(); } catch (e) {}
  },
  stopGameplay() {
    if (!this.gameplay) return;
    this.gameplay = false;
    try { this.ysdk.features.GameplayAPI.stop(); } catch (e) {}
  },

  onPause() {
    this.paused = true;
    AudioFX.pauseAll();
    document.getElementById("pause").classList.remove("hidden");
  },
  onResume() {
    this.paused = false;
    document.getElementById("pause").classList.add("hidden");
    AudioFX.resumeAll();
    AudioFX.setMusic(AudioFX.isMusic());
  },

  requestFs() {
    try { this.ysdk.screen.fullscreen.request(); } catch (e) {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fn) fn.call(el).catch(() => {});
    }
  },

  isAuth() {
    try { return !!(this.player && this.player.isAuthorized && this.player.isAuthorized()); }
    catch (e) { return false; }
  },

  async login() {
    try {
      await this.ysdk.auth.openAuthDialog();
      this.player = await this.ysdk.getPlayer();
      return this.isAuth();
    } catch (e) { return false; }
  },

  async loadCloud() {
    if (!this.player || !this.player.getData) return null;
    try { return await this.player.getData(); } catch (e) { return null; }
  },
  async saveCloud(data) {
    if (!this.player || !this.player.setData) return;
    try {
      await this.player.setData(data, true);
      if (this.player.setStats) await this.player.setStats({ coins: data.coins || 0 });
    } catch (e) {}
  },

  interstitial(cb) {
    this.stopGameplay();
    const done = () => { if (Game.screenNeedsPlay()) this.startGameplay(); cb && cb(); };
    try {
      this.ysdk.adv.showFullscreenAdv({
        callbacks: {
          onOpen: () => AudioFX.pauseAll(),
          onClose: () => { AudioFX.resumeAll(); done(); },
          onError: () => { AudioFX.resumeAll(); done(); }
        }
      });
    } catch (e) { AudioFX.resumeAll(); done(); }
  },

  rewarded(onReward, onFail) {
    this.stopGameplay();
    let got = false;
    const finish = () => {
      AudioFX.resumeAll();
      if (Game.screenNeedsPlay()) this.startGameplay();
      if (got) onReward && onReward();
      else onFail && onFail();
    };
    if (this.local) {
      got = true;
      Game.toast(t("adLocal"));
      finish();
      return;
    }
    try {
      this.ysdk.adv.showRewardedVideo({
        callbacks: {
          onOpen: () => AudioFX.pauseAll(),
          onRewarded: () => { got = true; },
          onClose: finish,
          onError: finish
        }
      });
    } catch (e) { finish(); }
  },

  _mock() {
    const self = this;
    return {
      environment: { i18n: { lang: "ru" } },
      deviceInfo: { isMobile: /Mobi|Android|iPhone/i.test(navigator.userAgent), isDesktop: true, type: "desktop" },
      features: { LoadingAPI: { ready() {} }, GameplayAPI: { start() {}, stop() {} } },
      adv: {
        showFullscreenAdv(o) { o.callbacks && o.callbacks.onClose && o.callbacks.onClose(false); },
        showRewardedVideo(o) { o.callbacks && o.callbacks.onRewarded && o.callbacks.onRewarded(); o.callbacks && o.callbacks.onClose && o.callbacks.onClose(true); },
        showBannerAdv() { return Promise.resolve({ stickyAdvIsShowing: false }); },
        getBannerAdvStatus() { return Promise.resolve({ stickyAdvIsShowing: false }); }
      },
      getPlayer: async () => ({
        isAuthorized: () => false,
        getData: async () => ({}),
        setData: async () => {},
        setStats: async () => {}
      }),
      auth: { openAuthDialog: async () => {} },
      screen: { fullscreen: { request: async () => {}, exit: async () => {}, status: "off" } },
      on() {}, off() {},
      EVENTS: {}
    };
  }
};

    const rawLang = (Platform.lang() || "ru").slice(0, 2).toLowerCase();
    this.lang = ["ru", "be", "kk", "uk", "uz"].includes(rawLang) ? "ru" : "en";
    document.documentElement.lang = this.lang === "ru" ? "ru" : "en";
    this.loadLocal();
    const cloud = await Platform.loadCloud();
    if (cloud && typeof cloud.coins === "number") this.mergeCloud(cloud);
    AudioFX.setMusic(this.music);
    AudioFX.setSfx(this.sfx);
    this.bindGlobal();
    this.showHome();
    Platform.ready();
    this.save();
    const href = location.href || "";
    if (location.protocol === "file:" && /Temp|\.zip/i.test(href)) {
      this.toast("Распакуйте архив в папку и откройте index.html оттуда");
    }
  },

  defaultChats() {
    const o = {};
    CONTENT.GIRLS.forEach((g) => { o[g.id] = { i: 0, h: 0, log: [], done: false }; });
    return o;
  },

  loadLocal() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (!d) { this.coins = CONTENT.START_COINS; this.chats = this.defaultChats(); return; }
      this.coins = d.coins || CONTENT.START_COINS;
      this.unlocked = d.unlocked || {};
      this.testsDone = d.testsDone || {};
      this.chats = d.chats || this.defaultChats();
      this.music = d.music !== false;
      this.sfx = d.sfx !== false;
      if (d.lang === "en" || d.lang === "ru") this.lang = d.lang;
    } catch (e) {
      this.coins = CONTENT.START_COINS;
      this.chats = this.defaultChats();
    }
  },

  mergeCloud(d) {
    if ((d.coins || 0) > this.coins) this.coins = d.coins;
    this.unlocked = Object.assign({}, d.unlocked || {}, this.unlocked);
    this.testsDone = Object.assign({}, d.testsDone || {}, this.testsDone);
    const base = this.defaultChats();
    Object.keys(base).forEach((id) => {
      const a = (d.chats && d.chats[id]) || base[id];
      const b = this.chats[id] || base[id];
      this.chats[id] = (a.i || 0) >= (b.i || 0) ? a : b;
    });
  },

  save() {
    const data = {
      coins: this.coins, unlocked: this.unlocked, testsDone: this.testsDone,
      chats: this.chats, music: this.music, sfx: this.sfx, lang: this.lang, t: Date.now()
    };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
    clearTimeout(this._cloudT);
    this._cloudT = setTimeout(() => Platform.saveCloud(data), 1200);
  },

  bindGlobal() {
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("selectstart", (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      e.preventDefault();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        AudioFX.pauseAll();
        Platform.stopGameplay();
      } else if (!Platform.paused) {
        AudioFX.resumeAll();
        if (this.screenNeedsPlay()) Platform.startGameplay();
      }
    });
    window.addEventListener("blur", () => { AudioFX.pauseAll(); });
    window.addEventListener("focus", () => { if (!document.hidden && !Platform.paused) AudioFX.resumeAll(); });
    document.addEventListener("keydown", (e) => this.onKey(e));
    document.addEventListener("pointerdown", () => {
      AudioFX.unlock();
      if (!this.fsAsked && Platform.isMobile()) {
        this.fsAsked = true;
        Platform.requestFs();
      }
    }, { once: false });
  },

  screenNeedsPlay() {
    return this.screen === "chat" || this.screen === "testPlay" || this.screen === "photo";
  },

  onKey(e) {
    if (e.key === "Escape") {
      if (!document.getElementById("modal").classList.contains("hidden")) { this.closeModal(); return; }
      if (this.screen === "chat" || this.screen === "test" || this.screen === "photo") this.goTab(this.tab);
      return;
    }
    const items = [...document.querySelectorAll("[data-k]")];
    if (!items.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowRight") {
      e.preventDefault();
      this.focus = (this.focus + 1) % items.length;
      items[this.focus].focus();
    } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
      e.preventDefault();
      this.focus = (this.focus - 1 + items.length) % items.length;
      items[this.focus].focus();
    } else if (e.key === "Enter") {
      if (document.activeElement && document.activeElement.dataset.k) document.activeElement.click();
    }
  },

  el(html) {
    const b = document.getElementById("view");
    b.innerHTML = html;
    b.classList.remove("hidden");
    document.getElementById("boot").classList.add("hidden");
    this.focus = 0;
    const first = b.querySelector("[data-k]");
    if (first) first.setAttribute("tabindex", "0");
  },

  toast(msg) {
    const n = document.getElementById("toast");
    n.textContent = msg;
    n.classList.remove("hidden");
    clearTimeout(this._tt);
    this._tt = setTimeout(() => n.classList.add("hidden"), 2400);
  },

  closeModal() { document.getElementById("modal").classList.add("hidden"); document.getElementById("modal").innerHTML = ""; },

  modal(html) {
    const m = document.getElementById("modal");
    m.innerHTML = html;
    m.classList.remove("hidden");
    m.onclick = (e) => { if (e.target === m) this.closeModal(); };
  },

  top(title, back) {
    return `<div class="topbar">
      ${back ? `<button class="icon-btn" data-k="1" onclick="Game.goTab(Game.tab)">${"←"}</button>` : `<span class="icon-btn">🌙</span>`}
      <h2>${title}</h2>
      <span class="coin-chip">✦ ${this.coins}</span>
      <button class="icon-btn" data-k="1" onclick="Game.toggleMusic()">${this.music ? "♫" : "🔇"}</button>
    </div>`;
  },

  nav() {
    const on = (id) => this.tab === id ? "on" : "";
    return `<nav class="nav">
      <button class="${on("chats")}" data-k="1" onclick="Game.goTab('chats')"><b>💬</b>${t("chats")}</button>
      <button class="${on("photos")}" data-k="1" onclick="Game.goTab('photos')"><b>📷</b>${t("photos")}</button>
      <button class="${on("tests")}" data-k="1" onclick="Game.goTab('tests')"><b>✦</b>${t("tests")}</button>
      <button class="${on("profile")}" data-k="1" onclick="Game.goTab('profile')"><b>♡</b>${t("profile")}</button>
    </nav>`;
  },

  goTab(id) {
    AudioFX.click();
    this.tab = id;
    this.screen = "hub";
    Platform.stopGameplay();
    if (id === "chats") this.showChats();
    else if (id === "photos") this.showPhotos();
    else if (id === "tests") this.showTests();
    else this.showProfile();
  },

  showHome() {
    this.tab = "chats";
    this.showChats(true);
  },

  showChats() {
    const cards = CONTENT.GIRLS.map((g) => {
      const st = this.chats[g.id] || { done: false, i: 0 };
      const mark = st.done ? "✓" : "";
      return `<button class="card chat-list" data-k="1" onclick="Game.openChat('${g.id}')">
        <img class="avatar" src="${g.avatar}" alt="">
        <div style="flex:1;min-width:0;text-align:left">
          <div><b>${tx(g.name)}</b> · ${g.age} · ${tx(g.job)} ${mark}</div>
          <div class="muted"><span class="online"></span> ${t("online")}</div>
          <div class="preview">${tx(g.preview)}</div>
        </div>
      </button>`;
    }).join("");
    this.el(`${this.top(tx(CONTENT.GAME_TITLE))}
      <div class="scroll">
        <div class="hero-card">
          <img src="assets/img/hero.jpg" alt="">
          <div class="shade"></div>
          <div class="copy">
            <div class="badge-row"><span class="badge hot">${t("hot")}</span><span class="badge">${t("chats")} · ${t("photos")} · ${t("tests")}</span></div>
            <h3>${tx(CONTENT.GAME_TITLE)}</h3>
            <div class="muted">${t("ageNote")}</div>
          </div>
        </div>
        <div class="section-title">${t("chats")}</div>
        <div class="chat-col" style="display:flex;flex-direction:column;gap:8px">${cards}</div>
      </div>${this.nav()}`);
  },

  openChat(id) {
    AudioFX.click();
    this.chatId = id;
    this.screen = "chat";
    Platform.startGameplay();
    const g = CONTENT.GIRLS.find((x) => x.id === id);
    const script = CONTENT.CHATS[id];
    if (!this.chats[id]) this.chats[id] = { i: 0, h: 0, log: [], done: false };
    const st = this.chats[id];
    if (!st.log.length) this.advanceNpc(id, true);
    this.renderChat(g, script, st);
  },

  advanceNpc(id, init) {
    const script = CONTENT.CHATS[id];
    const st = this.chats[id];
    while (st.i < script.length && script[st.i].her) {
      st.log.push({ who: "her", text: script[st.i].her });
      st.i++;
    }
    if (st.i >= script.length) st.done = true;
    if (!init) this.save();
  },

  renderChat(g, script, st) {
    const msgs = st.log.map((m) => `<div class="bubble ${m.who}">${tx(m.text)}</div>`).join("");
    let choices = "";
    if (st.i < script.length && script[st.i].opts) {
      choices = `<div class="choices">` + script[st.i].opts.map((op, i) =>
        `<button class="choice" data-k="1" onclick="Game.pickChat(${i})">${tx(op.t)}</button>`
      ).join("") + `</div>`;
    } else if (st.done) {
      const end = st.h >= 12 ? t("endingFire") : st.h >= 7 ? t("endingSpark") : t("endingWarm");
      choices = `<div class="q-card" style="text-align:center"><div class="stars">♥ ${st.h}</div><p>${end}</p>
        <button class="btn" data-k="1" onclick="Game.goTab('chats')">${t("continue")}</button></div>`;
    }
    this.el(`${this.top(tx(g.name) + " · " + g.age, true)}
      <div class="scroll" id="chatScroll">
        <div class="card" style="margin-bottom:10px">
          <img class="avatar" src="${g.avatar}" alt="">
          <div><b>${tx(g.name)}</b><div class="muted">${tx(g.job)} · <span class="online"></span> ${t("online")}</div></div>
        </div>
        <div class="messages">${msgs}</div>${choices}
      </div>`);
    const sc = document.getElementById("chatScroll");
    sc.scrollTop = sc.scrollHeight;
  },

  pickChat(i) {
    AudioFX.message();
    const id = this.chatId;
    const script = CONTENT.CHATS[id];
    const st = this.chats[id];
    const op = script[st.i].opts[i];
    st.log.push({ who: "me", text: op.t });
    st.h += op.h || 0;
    st.i++;
    this.advanceNpc(id);
    const g = CONTENT.GIRLS.find((x) => x.id === id);
    this.renderChat(g, script, st);
    this.save();
    if (st.done) {
      Platform.interstitial(() => {});
    }
  },

  showPhotos() {
    const cards = CONTENT.PHOTOS.map((p) => {
      const open = !!this.unlocked[p.id];
      const g = CONTENT.GIRLS.find((x) => x.id === p.girl);
      return `<button class="photo-card ${open ? "" : "locked"}" data-k="1" onclick="Game.openPhoto('${p.id}')">
        <img src="${p.src}" alt="">
        ${open ? "" : `<div class="lock-ico">🔒</div>`}
        <div class="meta">
          <span class="badge hot">${t("hot")}</span>
          <span class="badge gold">${open ? "✓" : "✦ " + p.price}</span>
        </div>
      </button>`;
    }).join("");
    this.el(`${this.top(t("photos"))}
      <div class="scroll">
        <div class="btn-row" style="margin-bottom:10px">
          <button class="btn gold" data-k="1" onclick="Game.adCoins()">${t("watchAdCoins")}</button>
        </div>
        <div class="photo-grid">${cards}</div>
      </div>${this.nav()}`);
  },

  openPhoto(id) {
    AudioFX.click();
    const p = CONTENT.PHOTOS.find((x) => x.id === id);
    const open = !!this.unlocked[id];
    const g = CONTENT.GIRLS.find((x) => x.id === p.girl);
    if (open) {
      this.screen = "photo";
      Platform.startGameplay();
      this.modal(`<div class="modal-card" style="text-align:center">
        <img src="${p.src}" alt="" style="width:100%;border-radius:12px;max-height:55vh;object-fit:contain">
        <h3>${tx(p.title)}</h3>
        <p class="muted">${tx(g.name)} · ${t("hot")}</p>
        <button class="btn sec" data-k="1" onclick="Game.closeModal();Game.goTab('photos')">${t("close")}</button>
      </div>`);
      return;
    }
    this.modal(`<div class="modal-card">
      <div class="badge-row"><span class="badge hot">${t("hot")}</span><span class="badge gold">✦ ${p.price}</span></div>
      <h3>${tx(p.title)}</h3>
      <p class="muted">${tx(g.name)} · ${t("rewardedHint")}</p>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn" data-k="1" onclick="Game.buyPhoto('${id}')">${t("openFor")} ${p.price}</button>
      </div>
      <button class="btn cyan" style="width:100%;margin-top:8px" data-k="1" onclick="Game.adPhoto('${id}')">${t("watchAd")}</button>
      <button class="btn sec" style="width:100%;margin-top:8px" data-k="1" onclick="Game.closeModal()">${t("close")}</button>
    </div>`);
  },

  unlockPhoto(id) {
    this.unlocked[id] = 1;
    this.save();
    AudioFX.success();
    this.toast(t("opened"));
    this.closeModal();
    this.showPhotos();
    this.openPhoto(id);
  },

  buyPhoto(id) {
    const p = CONTENT.PHOTOS.find((x) => x.id === id);
    if (this.coins < p.price) { this.toast(t("needCoins")); return; }
    this.coins -= p.price;
    this.unlockPhoto(id);
  },

  adPhoto(id) {
    Platform.rewarded(() => this.unlockPhoto(id), () => this.toast(t("adFail")));
  },

  adCoins() {
    Platform.rewarded(() => {
      this.coins += CONTENT.AD_COINS;
      this.save();
      AudioFX.coin();
      this.toast(t("coinsGot", { c: CONTENT.AD_COINS }));
      if (this.tab === "photos") this.showPhotos();
      if (this.tab === "profile") this.showProfile();
    }, () => this.toast(t("adFail")));
  },

  showTests() {
    const cards = CONTENT.QUIZZES.map((q) => {
      const done = !!this.testsDone[q.id];
      return `<button class="card" data-k="1" onclick="Game.previewTest('${q.id}')">
        <img class="avatar" src="${q.cover}" alt="">
        <div style="text-align:left;flex:1">
          <b>${tx(q.title)}</b>
          <div class="muted">${t("testReward", { n: q.questions, c: q.reward })}</div>
          <div class="preview">${done ? "✓" : "15"} </div>
        </div>
      </button>`;
    }).join("");
    this.el(`${this.top(t("tests"))}
      <div class="scroll"><div style="display:flex;flex-direction:column;gap:8px">${cards}</div></div>${this.nav()}`);
  },

  previewTest(id) {
    AudioFX.click();
    const q = CONTENT.QUIZZES.find((x) => x.id === id);
    this.modal(`<div class="modal-card">
      <h3>${tx(q.title)}</h3>
      <p><b>${t("testReward", { n: q.questions, c: q.reward })}</b></p>
      <p class="muted">${this.testsDone[id] ? t("alreadyRewarded") : ""}</p>
      <button class="btn" style="width:100%" data-k="1" onclick="Game.startTest('${id}')">${t("startTest")}</button>
      <button class="btn sec" style="width:100%;margin-top:8px" data-k="1" onclick="Game.closeModal()">${t("close")}</button>
    </div>`);
  },

  startTest(id) {
    this.closeModal();
    const q = CONTENT.QUIZZES.find((x) => x.id === id);
    this.test = { id, i: 0, s: 0, quiz: q };
    this.screen = "testPlay";
    Platform.startGameplay();
    this.renderQ();
  },

  renderQ() {
    const st = this.test;
    const item = st.quiz.qs[st.i];
    const pct = Math.round((st.i / st.quiz.qs.length) * 100);
    const ans = item.a.map((a, i) =>
      `<button class="answer" data-k="1" onclick="Game.answer(${i})">${tx(a.t)}</button>`
    ).join("");
    this.el(`${this.top(tx(st.quiz.title), true)}
      <div class="scroll">
        <div class="q-card">
          <div class="muted">${st.i + 1} / ${st.quiz.qs.length}</div>
          <div class="progress"><i style="width:${pct}%"></i></div>
          <h3>${tx(item.q)}</h3>
          <div class="answers">${ans}</div>
        </div>
      </div>`);
  },

  answer(i) {
    AudioFX.click();
    const st = this.test;
    st.s += st.quiz.qs[st.i].a[i].s;
    st.i++;
    if (st.i >= st.quiz.qs.length) this.finishTest();
    else this.renderQ();
  },

  finishTest() {
    const st = this.test;
    let res = st.quiz.results[0];
    st.quiz.results.forEach((r) => { if (st.s >= r.min) res = r; });
    let bonus = 0;
    if (!this.testsDone[st.id]) {
      bonus = st.quiz.reward;
      this.coins += bonus;
      this.testsDone[st.id] = { s: st.s, t: Date.now() };
      AudioFX.coin();
    } else AudioFX.success();
    this.save();
    this.screen = "result";
    Platform.stopGameplay();
    this.el(`${this.top(t("result"), true)}
      <div class="scroll result">
        <div class="q-card">
          <div class="muted">${tx(st.quiz.title)}</div>
          <div class="big">${tx(res.title)}</div>
          <div class="stars">${"★".repeat(Math.min(5, 1 + Math.floor(st.s / 10)))}</div>
          <p>${tx(res.text)}</p>
          <p class="badge gold" style="display:inline-block">${bonus ? t("coinsGot", { c: bonus }) : t("alreadyRewarded")}</p>
          <div class="btn-row" style="margin-top:14px">
            <button class="btn" data-k="1" onclick="Game.startTest('${st.id}')">${t("again")}</button>
            <button class="btn sec" data-k="1" onclick="Game.goTab('tests')">${t("tests")}</button>
          </div>
        </div>
      </div>`);
    Platform.interstitial(() => {});
  },

  toggleMusic() {
    this.music = !this.music;
    AudioFX.setMusic(this.music);
    this.save();
    if (this.screen === "hub") this.goTab(this.tab);
    else if (this.screen === "chat") this.openChat(this.chatId);
    else if (this.screen === "testPlay" && this.test && this.test.i < (this.test.quiz.qs.length)) this.renderQ();
  },

  showProfile() {
    const chatsDone = Object.values(this.chats).filter((c) => c.done).length;
    const tests = Object.keys(this.testsDone).length;
    const photos = Object.keys(this.unlocked).length;
    this.el(`${this.top(t("profile"))}
      <div class="scroll">
        <div class="stat-row">
          <div class="stat"><b>${this.coins}</b>${t("coins")}</div>
          <div class="stat"><b>${photos}/${CONTENT.PHOTOS.length}</b>${t("photosOpen")}</div>
          <div class="stat"><b>${chatsDone}/${CONTENT.GIRLS.length}</b>${t("chatsDone")}</div>
          <div class="stat"><b>${tests}/${CONTENT.QUIZZES.length}</b>${t("testsDone")}</div>
        </div>
        <button class="btn gold" style="width:100%;margin:8px 0" data-k="1" onclick="Game.adCoins()">${t("watchAdCoins")}</button>
        <div class="q-card" style="margin:10px 0">
          <b>${t("login")}</b>
          <p class="muted">${t("loginHint")}</p>
          ${Platform.isAuth() ? `<p>Yandex ID ✓</p>` : `<button class="btn" data-k="1" onclick="Game.doLogin()">${t("login")}</button>`}
        </div>
        <div class="q-card" style="margin:10px 0">
          <div class="btn-row">
            <button class="btn sec" data-k="1" onclick="Game.toggleMusic()">${t("music")}: ${this.music ? "ON" : "OFF"}</button>
            <button class="btn sec" data-k="1" onclick="Game.toggleSfx()">${t("sfx")}: ${this.sfx ? "ON" : "OFF"}</button>
          </div>
          <div class="btn-row" style="margin-top:8px">
            <button class="btn sec" data-k="1" onclick="Game.setLang('ru')">🇷🇺 Русский</button>
            <button class="btn sec" data-k="1" onclick="Game.setLang('en')">🇬🇧 English</button>
          </div>
        </div>
        <div class="q-card"><b>${t("how")}</b><p class="muted">${t("howBody")}</p></div>
        <div class="q-card" style="margin-top:10px"><b>${t("privacy")}</b><p class="muted">${t("privacyBody")}</p></div>
      </div>${this.nav()}`);
  },

  toggleSfx() {
    this.sfx = !this.sfx;
    AudioFX.setSfx(this.sfx);
    AudioFX.click();
    this.save();
    this.showProfile();
  },

  setLang(l) {
    this.lang = l;
    document.documentElement.lang = l === "ru" ? "ru" : "en";
    this.save();
    AudioFX.click();
    this.showProfile();
  },

  async doLogin() {
    AudioFX.click();
    const ok = await Platform.login();
    if (ok) {
      const cloud = await Platform.loadCloud();
      if (cloud) this.mergeCloud(cloud);
      this.save();
    }
    this.showProfile();
  }
};

window.Game = Game;
Game.start().catch(function (e) {
  var msg = (e && e.message) ? e.message : String(e);
  document.body.style.background = "#120218";
  document.body.innerHTML = '<div style="padding:28px;font-family:Segoe UI,sans-serif;color:#fff;max-width:560px">' +
    "<h2>Игра не запустилась</h2>" +
    "<p>Распакуйте архив <b>целиком</b> на Рабочий стол. Затем откройте файл <b>index.html</b> из этой папки. Не открывайте его прямо изнутри zip.</p>" +
    "<pre style='white-space:pre-wrap;color:#ff87d0'>" + msg + "</pre></div>";
});

  </script>
</body>
</html>
