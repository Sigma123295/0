:root {
  --bg: #071018;
  --cyan: #7ef0ff;
  --blue: #3db4ff;
  --gold: #ffd15a;
  --text: #f4fbff;
  --muted: #9bb8cc;
  --line: rgba(140, 220, 255, 0.28);
  --tg-in: #1e2c3a;
  --tg-out: #2b6ea3;
  --safe: env(safe-area-inset-top, 0px);
  --safeb: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: #050b12; color: var(--text);
  font-family: "Segoe UI", "Nunito", "Trebuchet MS", sans-serif;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; touch-action: manipulation;
}
img { -webkit-user-drag: none; pointer-events: none; }
button { cursor: pointer; font: inherit; color: inherit; }
#app {
  width: 100%; height: 100%; margin: 0 auto;
  max-width: min(100vw, calc(100vh * 2));
  max-height: min(100vh, calc(100vw * 2));
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(900px 500px at 20% 0%, #1a4d73 0%, transparent 55%),
    linear-gradient(180deg, #0b2236, #050b12);
}
.hidden { display: none !important; }

.phone {
  width: min(430px, 100%);
  height: min(100%, 900px);
  background: #0a0d12;
  border-radius: 40px;
  padding: 11px;
  box-shadow: 0 20px 60px #000a, inset 0 0 0 2px #2a3a4a;
  display: flex; flex-direction: column;
}
.phone-screen {
  flex: 1; min-height: 0; border-radius: 30px; overflow: hidden;
  background: #071018; display: flex; flex-direction: column; position: relative;
}
.status {
  height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px 0; font-size: 12px; font-weight: 700; z-index: 5;
}
.status span { opacity: .9; }
.homebar {
  height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  background: #071018;
}
.homebar i {
  width: 120px; height: 5px; border-radius: 99px; background: #dbefff; display: block; border: 0;
}
.homebar button { background: none; border: 0; padding: 8px 40px; }

.boot { position: absolute; inset: 0; z-index: 20; }
.boot-hero { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.boot-glow { position: absolute; inset: 0; background: linear-gradient(180deg, transparent, #071018 78%); }
.boot-copy { position: absolute; left: 0; right: 0; bottom: 36px; text-align: center; padding: 0 16px; }
.boot h1 { margin: 0; font-size: 28px; }
.boot-kicker { letter-spacing: .2em; text-transform: uppercase; color: var(--cyan); font-size: 11px; }
.boot-bar { width: 160px; height: 5px; margin: 12px auto 0; border-radius: 99px; background: #fff2; overflow: hidden; }
.boot-bar i { display: block; height: 100%; width: 30%; background: linear-gradient(90deg, var(--blue), var(--cyan)); animation: load 1.1s ease infinite; }
@keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }

.view { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.topbar {
  height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 10px; flex-shrink: 0;
  background: rgba(8,20,32,.92);
}
.topbar h2 { flex: 1; margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn, .coin-chip {
  border: 1px solid var(--line); background: rgba(255,255,255,.06);
  border-radius: 999px; min-height: 34px; min-width: 34px;
  display: inline-flex; align-items: center; justify-content: center; padding: 0 10px;
}
.coin-chip { color: var(--gold); font-weight: 800; font-size: 13px; }

.scroll {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y;
  padding: 10px 12px 16px;
}
.scroll::-webkit-scrollbar { width: 4px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(80,190,255,.45); border-radius: 99px; }

.home {
  flex: 1; min-height: 0; background: #071018 url("assets/img/ui/home-wall.jpg") center/cover no-repeat;
  display: flex; flex-direction: column; padding: 12px 18px 8px;
}
.home-grid {
  margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 10px; padding-bottom: 8px;
}
.app-ico { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.app-ico img {
  width: 62px; height: 62px; border-radius: 16px; object-fit: cover;
  box-shadow: 0 8px 20px #0006; pointer-events: none;
}
.app-ico span { font-size: 11px; font-weight: 700; text-shadow: 0 1px 4px #000; text-align: center; line-height: 1.2; }

.card {
  width: 100%; text-align: left; background: rgba(20,70,110,.78); border: 1px solid var(--line);
  border-radius: 16px; padding: 10px; display: flex; gap: 10px; align-items: center;
}
.avatar { width: 52px; height: 52px; border-radius: 16px; object-fit: cover; flex-shrink: 0; border: 2px solid var(--cyan); }
.muted { color: var(--muted); font-size: 12px; }
.preview { color: #9ad8ff; font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  border: 0; border-radius: 14px; min-height: 44px; padding: 0 14px; font-weight: 800;
  background: linear-gradient(135deg, var(--blue), #6a7bff); color: #fff;
}
.btn.sec { background: rgba(255,255,255,.08); border: 1px solid var(--line); }
.btn.gold { background: linear-gradient(135deg, #ffd15a, #ff9a3c); color: #3a2200; }
.btn.cyan { background: linear-gradient(135deg, #5ce1ff, #4f8cff); }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

.photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.photo-card { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 3/4; border: 1px solid var(--line); }
.photo-card img { width: 100%; height: 100%; object-fit: cover; }
.photo-card.locked img { filter: blur(14px) saturate(1.15); transform: scale(1.08); }
.photo-card .meta {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 6px;
  background: linear-gradient(180deg, transparent, #000c);
  display: flex; justify-content: space-between;
}
.lock-ico { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 24px; }
.badge { background: rgba(0,0,0,.45); border-radius: 8px; padding: 3px 7px; font-size: 11px; }
.badge.hot { background: #ff2d7a; font-weight: 800; }
.badge.gold { background: var(--gold); color: #3a2200; font-weight: 800; }

.q-card { background: rgba(20,70,110,.78); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.progress { height: 7px; background: #fff1; border-radius: 99px; overflow: hidden; margin: 8px 0 12px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
.answers { display: flex; flex-direction: column; gap: 8px; }
.answer, .choice {
  text-align: left; min-height: 46px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(255,255,255,.07); padding: 10px 12px;
}
.result { text-align: center; }
.result .big { font-size: 24px; margin: 8px 0; }
.stars { color: var(--gold); letter-spacing: 3px; }

.tg {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background-color: #0e1a22;
  background-image:
    radial-gradient(circle at 12px 12px, rgba(255,255,255,.05) 1px, transparent 0),
    radial-gradient(circle at 36px 28px, rgba(90,180,160,.12) 8px, transparent 9px);
  background-size: 48px 48px, 64px 64px;
}
.messages { display: flex; flex-direction: column; gap: 6px; padding: 8px 8px 12px; }
.bubble {
  max-width: 82%; padding: 8px 10px; border-radius: 14px; line-height: 1.35; font-size: 14px;
  word-wrap: break-word;
}
.bubble.her { align-self: flex-start; background: var(--tg-in); border-bottom-left-radius: 4px; }
.bubble.me { align-self: flex-end; background: var(--tg-out); border-bottom-right-radius: 4px; }
.choices { display: flex; flex-direction: column; gap: 6px; padding: 0 8px 10px; }
.tg-item { width: 100%; }
.dot { width: 9px; height: 9px; background: #39ff95; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px #39ff95; }

.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.stat { background: rgba(255,255,255,.07); border-radius: 14px; padding: 12px; text-align: center; }
.stat b { display: block; font-size: 20px; color: var(--gold); }

.toast {
  position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%);
  background: #12344f; border: 1px solid var(--line); padding: 8px 12px; border-radius: 12px;
  z-index: 30; max-width: 90%; font-size: 13px;
}
.modal {
  position: absolute; inset: 0; background: rgba(5,10,16,.72); display: flex; align-items: flex-end;
  justify-content: center; z-index: 40; padding: 12px;
}
.modal-card { width: 100%; background: #154262; border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.pause {
  position: absolute; inset: 0; background: rgba(6,12,20,.82); display: flex; align-items: center;
  justify-content: center; z-index: 50;
}
@media (max-width: 520px) {
  .phone { width: 100%; height: 100%; border-radius: 0; padding: 0; box-shadow: none; }
  .phone-screen { border-radius: 0; }
}

const AudioFX = (() => {
  let ctx = null, master, musicGain, sfxGain;
  let musicOn = true, sfxOn = true, running = false, timer = 0, step = 0;
  const melody = [220, 261.63, 293.66, 329.63, 392, 329.63, 293.66, 261.63, 246.94, 220, 196, 220];

  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      ctx = new C();
      master = ctx.createGain(); master.gain.value = 0.72; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = 0.22; musicGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function beep(freq, dur, type, vol, when) {
    const c = ac();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + (when || 0));
    g.gain.exponentialRampToValueAtTime(vol || 0.2, c.currentTime + (when || 0) + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + (when || 0) + dur);
    o.connect(g); g.connect(sfxGain);
    o.start(c.currentTime + (when || 0));
    o.stop(c.currentTime + (when || 0) + dur + 0.02);
  }

  function click() { if (!sfxOn) return; beep(840, 0.05, "sine", 0.1); }
  function coin() { if (!sfxOn) return; beep(660, 0.08, "sine", 0.1); beep(990, 0.12, "sine", 0.12, 0.07); }
  function success() { if (!sfxOn) return; beep(523, 0.12, "sine", 0.1); beep(659, 0.14, "sine", 0.1, 0.1); beep(784, 0.18, "sine", 0.12, 0.2); }

  function tone(freq, dur, vol) {
    const c = ac();
    const o = c.createOscillator();
    const g = c.createGain();
    const f = c.createBiquadFilter();
    o.type = "sine";
    o.frequency.value = freq;
    f.type = "lowpass"; f.frequency.value = 1400;
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, c.currentTime + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(f); f.connect(g); g.connect(musicGain);
    o.start(); o.stop(c.currentTime + dur + 0.05);
  }

  function tick() {
    if (!running || !musicOn) return;
    const n = melody[step % melody.length];
    tone(n, 1.15, 0.09);
    tone(n / 2, 1.4, 0.05);
    step++;
  }

  function startPad() {
    stopPad();
    ac();
    running = true;
    step = 0;
    tick();
    timer = setInterval(tick, 720);
  }
  function stopPad() {
    running = false;
    if (timer) { clearInterval(timer); timer = 0; }
  }

  return {
    unlock() { ac(); },
    click, coin, success, message: click,
    setMusic(v) {
      musicOn = v;
      if (musicGain) musicGain.gain.value = v && !this._paused ? 0.22 : 0;
      if (v && !running && !this._paused) startPad();
      if (!v) stopPad();
    },
    setSfx(v) { sfxOn = v; },
    pauseAll() {
      this._paused = true;
      if (musicGain) musicGain.gain.value = 0;
      if (sfxGain) sfxGain.gain.value = 0;
      if (ctx && ctx.state === "running") ctx.suspend();
    },
    resumeAll() {
      this._paused = false;
      if (ctx) ctx.resume();
      if (sfxGain) sfxGain.gain.value = sfxOn ? 0.5 : 0;
      if (musicOn) {
        if (musicGain) musicGain.gain.value = 0.22;
        if (!running) startPad();
      }
    },
    isMusic() { return musicOn; },
    isSfx() { return sfxOn; }
  };
})();

const Platform = {
  ysdk: null,
  player: null,
  local: true,
  paused: false,
  gameplay: false,
  readySent: false,

  async init() {
    if (location.protocol === "file:") {
      this.local = true;
      this.ysdk = this._mock();
      return this.ysdk;
    }
    const waitYa = () => new Promise((resolve) => {
      if (window.YaGames) return resolve(true);
      let n = 0;
      const id = setInterval(() => {
        n++;
        if (window.YaGames) { clearInterval(id); resolve(true); }
        else if (n > 20) { clearInterval(id); resolve(false); }
      }, 80);
    });
    const has = await waitYa();
    if (!has) {
      this.local = true;
      this.ysdk = this._mock();
      return this.ysdk;
    }
    this.ysdk = await YaGames.init();
    this.local = false;
    this.ysdk.on("game_api_pause", () => this.onPause());
    this.ysdk.on("game_api_resume", () => this.onResume());
    if (this.ysdk.EVENTS) {
      this.ysdk.on(this.ysdk.EVENTS.ACCOUNT_SELECTION_DIALOG_CLOSED, () => {
        location.reload();
      });
    }
    try { this.player = await this.ysdk.getPlayer(); } catch (e) { this.player = null; }
    try {
      const st = await this.ysdk.adv.getBannerAdvStatus();
      if (!st.stickyAdvIsShowing) this.ysdk.adv.showBannerAdv();
    } catch (e) {}
    return this.ysdk;
  },

  lang() {
    try {
      return (this.ysdk && this.ysdk.environment && this.ysdk.environment.i18n.lang) || navigator.language || "ru";
    } catch (e) { return "ru"; }
  },

  isMobile() {
    try {
      const d = this.ysdk && this.ysdk.deviceInfo;
      if (d) return !!(d.isMobile || d.isTablet);
    } catch (e) {}
    return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  },

  ready() {
    if (this.readySent) return;
    this.readySent = true;
    try { this.ysdk.features.LoadingAPI.ready(); } catch (e) {}
  },

  startGameplay() {
    if (this.gameplay) return;
    this.gameplay = true;
    try { this.ysdk.features.GameplayAPI.start(); } catch (e) {}
  },
  stopGameplay() {
    if (!this.gameplay) return;
    this.gameplay = false;
    try { this.ysdk.features.GameplayAPI.stop(); } catch (e) {}
  },

  onPause() {
    this.paused = true;
    AudioFX.pauseAll();
    document.getElementById("pause").classList.remove("hidden");
  },
  onResume() {
    this.paused = false;
    document.getElementById("pause").classList.add("hidden");
    AudioFX.resumeAll();
    AudioFX.setMusic(AudioFX.isMusic());
  },

  requestFs() {
    try { this.ysdk.screen.fullscreen.request(); } catch (e) {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fn) fn.call(el).catch(() => {});
    }
  },

  isAuth() {
    try { return !!(this.player && this.player.isAuthorized && this.player.isAuthorized()); }
    catch (e) { return false; }
  },

  async login() {
    try {
      await this.ysdk.auth.openAuthDialog();
      this.player = await this.ysdk.getPlayer();
      return this.isAuth();
    } catch (e) { return false; }
  },

  async loadCloud() {
    if (!this.player || !this.player.getData) return null;
    try { return await this.player.getData(); } catch (e) { return null; }
  },
  async saveCloud(data) {
    if (!this.player || !this.player.setData) return;
    try {
      await this.player.setData(data, true);
      if (this.player.setStats) await this.player.setStats({ coins: data.coins || 0 });
    } catch (e) {}
  },

  interstitial(cb) {
    this.stopGameplay();
    const done = () => { if (Game.screenNeedsPlay()) this.startGameplay(); cb && cb(); };
    try {
      this.ysdk.adv.showFullscreenAdv({
        callbacks: {
          onOpen: () => AudioFX.pauseAll(),
          onClose: () => { AudioFX.resumeAll(); done(); },
          onError: () => { AudioFX.resumeAll(); done(); }
        }
      });
    } catch (e) { AudioFX.resumeAll(); done(); }
  },

  rewarded(onReward, onFail) {
    this.stopGameplay();
    let got = false;
    const finish = () => {
      AudioFX.resumeAll();
      if (Game.screenNeedsPlay()) this.startGameplay();
      if (got) onReward && onReward();
      else onFail && onFail();
    };
    if (this.local) {
      got = true;
      Game.toast(t("adLocal"));
      finish();
      return;
    }
    try {
      this.ysdk.adv.showRewardedVideo({
        callbacks: {
          onOpen: () => AudioFX.pauseAll(),
          onRewarded: () => { got = true; },
          onClose: finish,
          onError: finish
        }
      });
    } catch (e) { finish(); }
  },

  _mock() {
    const self = this;
    return {
      environment: { i18n: { lang: "ru" } },
      deviceInfo: { isMobile: /Mobi|Android|iPhone/i.test(navigator.userAgent), isDesktop: true, type: "desktop" },
      features: { LoadingAPI: { ready() {} }, GameplayAPI: { start() {}, stop() {} } },
      adv: {
        showFullscreenAdv(o) { o.callbacks && o.callbacks.onClose && o.callbacks.onClose(false); },
        showRewardedVideo(o) { o.callbacks && o.callbacks.onRewarded && o.callbacks.onRewarded(); o.callbacks && o.callbacks.onClose && o.callbacks.onClose(true); },
        showBannerAdv() { return Promise.resolve({ stickyAdvIsShowing: false }); },
        getBannerAdvStatus() { return Promise.resolve({ stickyAdvIsShowing: false }); }
      },
      getPlayer: async () => ({
        isAuthorized: () => false,
        getData: async () => ({}),
        setData: async () => {},
        setStats: async () => {}
      }),
      auth: { openAuthDialog: async () => {} },
      screen: { fullscreen: { request: async () => {}, exit: async () => {}, status: "off" } },
      on() {}, off() {},
      EVENTS: {}
    };
  }
};

const SAVE_KEY = "kayphone_v1";

const Game = {
  lang: "ru",
  screen: "home",
  coins: 0,
  unlocked: {},
  testsDone: {},
  chats: {},
  music: true,
  sfx: true,
  focus: 0,
  test: null,
  chatId: null,
  fsAsked: false,

  async start() {
    await Platform.init();
    this.lang = "ru";
    document.documentElement.lang = "ru";
    this.loadLocal();
    const cloud = await Platform.loadCloud();
    if (cloud && typeof cloud.coins === "number") this.mergeCloud(cloud);
    AudioFX.setMusic(this.music);
    AudioFX.setSfx(this.sfx);
    this.bindGlobal();
    this.showHome();
    Platform.ready();
    this.save();
    this.tickClock();
    setInterval(() => this.tickClock(), 30000);
  },

  defaultChats() {
    const o = {};
    CONTENT.GIRLS.forEach((g) => { o[g.id] = { i: 0, h: 0, log: [], done: false }; });
    return o;
  },

  loadLocal() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (!d) { this.coins = CONTENT.START_COINS || 0; this.chats = this.defaultChats(); return; }
      this.coins = d.coins || 0;
      this.unlocked = d.unlocked || {};
      this.testsDone = d.testsDone || {};
      this.chats = d.chats || this.defaultChats();
      this.music = d.music !== false;
      this.sfx = d.sfx !== false;
    } catch (e) { this.coins = 0; this.chats = this.defaultChats(); }
  },

  mergeCloud(d) {
    if ((d.coins || 0) > this.coins) this.coins = d.coins;
    this.unlocked = Object.assign({}, d.unlocked || {}, this.unlocked);
    this.testsDone = Object.assign({}, d.testsDone || {}, this.testsDone);
    const base = this.defaultChats();
    Object.keys(base).forEach((id) => {
      const a = (d.chats && d.chats[id]) || base[id];
      const b = this.chats[id] || base[id];
      this.chats[id] = (a.i || 0) >= (b.i || 0) ? a : b;
    });
  },

  save() {
    const data = {
      coins: this.coins, unlocked: this.unlocked, testsDone: this.testsDone,
      chats: this.chats, music: this.music, sfx: this.sfx, t: Date.now()
    };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
    clearTimeout(this._cloudT);
    this._cloudT = setTimeout(() => Platform.saveCloud(data), 1200);
  },

  bindGlobal() {
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("selectstart", (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      e.preventDefault();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { AudioFX.pauseAll(); Platform.stopGameplay(); }
      else if (!Platform.paused) {
        AudioFX.resumeAll();
        if (this.screenNeedsPlay()) Platform.startGameplay();
      }
    });
    window.addEventListener("blur", () => AudioFX.pauseAll());
    window.addEventListener("focus", () => { if (!document.hidden && !Platform.paused) AudioFX.resumeAll(); });
    document.addEventListener("keydown", (e) => this.onKey(e));
    document.addEventListener("pointerdown", () => {
      AudioFX.unlock();
      if (!this.fsAsked && Platform.isMobile()) { this.fsAsked = true; Platform.requestFs(); }
    });
  },

  screenNeedsPlay() {
    return this.screen === "testPlay" || this.screen === "chat" || this.screen === "photo";
  },

  tickClock() {
    const el = document.getElementById("clock");
    if (!el) return;
    const d = new Date();
    el.textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  },

  onKey(e) {
    if (e.key === "Escape") {
      if (!document.getElementById("modal").classList.contains("hidden")) { this.closeModal(); return; }
      if (this.screen === "home") return;
      if (this.screen === "chat") { this.showChats(); return; }
      this.showHome();
      return;
    }
    const items = [...document.querySelectorAll("[data-k]")];
    if (!items.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowRight") {
      e.preventDefault(); this.focus = (this.focus + 1) % items.length; items[this.focus].focus();
    } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
      e.preventDefault(); this.focus = (this.focus - 1 + items.length) % items.length; items[this.focus].focus();
    } else if (e.key === "Enter" && document.activeElement && document.activeElement.dataset.k) {
      document.activeElement.click();
    }
  },

  el(html) {
    const b = document.getElementById("view");
    b.innerHTML = html;
    b.classList.remove("hidden");
    document.getElementById("boot").classList.add("hidden");
    this.focus = 0;
    this.tickClock();
  },

  toast(msg) {
    const n = document.getElementById("toast");
    n.textContent = msg;
    n.classList.remove("hidden");
    clearTimeout(this._tt);
    this._tt = setTimeout(() => n.classList.add("hidden"), 2400);
  },
  closeModal() { document.getElementById("modal").classList.add("hidden"); document.getElementById("modal").innerHTML = ""; },
  modal(html) {
    const m = document.getElementById("modal");
    m.innerHTML = html;
    m.classList.remove("hidden");
    m.onclick = (e) => { if (e.target === m) this.closeModal(); };
  },

  top(title, backFn) {
    const back = backFn
      ? `<button class="icon-btn" data-k="1" onclick="${backFn}">←</button>`
      : `<span class="icon-btn">✧</span>`;
    return `<div class="topbar">${back}<h2>${title}</h2><span class="coin-chip">✦ ${this.coins}</span></div>`;
  },

  showHome() {
    AudioFX.click();
    this.screen = "home";
    Platform.stopGameplay();
    this.el(`<div class="home">
      <div class="home-grid">
        <button class="app-ico" data-k="1" onclick="Game.showTests()">
          <img src="assets/img/ui/app-test.jpg" alt=""><span>TEST 18+</span>
        </button>
        <button class="app-ico" data-k="1" onclick="Game.showPhotos()">
          <img src="assets/img/ui/app-photos.jpg" alt=""><span>Горячие<br>фоточки</span>
        </button>
        <button class="app-ico" data-k="1" onclick="Game.showChats()">
          <img src="assets/img/ui/app-chats.jpg" alt=""><span>Мои чаты</span>
        </button>
        <button class="app-ico" data-k="1" onclick="Game.showProfile()">
          <img src="assets/img/ui/app-profile.jpg" alt=""><span>Мой профиль</span>
        </button>
      </div>
    </div>`);
  },

  showTests() {
    AudioFX.click();
    this.screen = "tests";
    Platform.stopGameplay();
    const cards = CONTENT.QUIZZES.map((q) => {
      const done = !!this.testsDone[q.id];
      return `<button class="card" data-k="1" onclick="Game.previewTest('${q.id}')">
        <img class="avatar" src="${q.cover}" alt="">
        <div style="min-width:0;flex:1">
          <b>${tx(q.title)}</b>
          <div class="muted">${t("testReward", { n: q.questions, c: q.reward })}</div>
          <div class="preview">${done ? "✓ +20" : "+20 ✦"}</div>
        </div>
      </button>`;
    }).join("");
    this.el(`${this.top(t("tests"), "Game.showHome()")}
      <div class="scroll" style="display:flex;flex-direction:column;gap:8px">${cards}</div>`);
  },

  previewTest(id) {
    AudioFX.click();
    const q = CONTENT.QUIZZES.find((x) => x.id === id);
    this.modal(`<div class="modal-card">
      <h3>${tx(q.title)}</h3>
      <p><b>${t("testReward", { n: q.questions, c: q.reward })}</b></p>
      <p class="muted">${this.testsDone[id] ? t("alreadyRewarded") : ""}</p>
      <button class="btn" style="width:100%" data-k="1" onclick="Game.startTest('${id}')">${t("startTest")}</button>
      <button class="btn sec" style="width:100%;margin-top:8px" data-k="1" onclick="Game.closeModal()">${t("close")}</button>
    </div>`);
  },

  startTest(id) {
    this.closeModal();
    const q = CONTENT.QUIZZES.find((x) => x.id === id);
    this.test = { id, i: 0, s: 0, quiz: q };
    this.screen = "testPlay";
    Platform.startGameplay();
    this.renderQ();
  },

  renderQ() {
    const st = this.test;
    const item = st.quiz.qs[st.i];
    const pct = Math.round((st.i / st.quiz.qs.length) * 100);
    const ans = item.a.map((a, i) => `<button class="answer" data-k="1" onclick="Game.answer(${i})">${tx(a.t)}</button>`).join("");
    this.el(`${this.top(tx(st.quiz.title), "Game.showTests()")}
      <div class="scroll"><div class="q-card">
        <div class="muted">${st.i + 1} / ${st.quiz.qs.length} · ${t("testReward", { n: st.quiz.qs.length, c: st.quiz.reward })}</div>
        <div class="progress"><i style="width:${pct}%"></i></div>
        <h3>${tx(item.q)}</h3>
        <div class="answers">${ans}</div>
      </div></div>`);
  },

  answer(i) {
    AudioFX.click();
    const st = this.test;
    st.s += st.quiz.qs[st.i].a[i].s;
    st.i++;
    if (st.i >= st.quiz.qs.length) this.finishTest();
    else this.renderQ();
  },

  finishTest() {
    const st = this.test;
    let res = st.quiz.results[0];
    st.quiz.results.forEach((r) => { if (st.s >= r.min) res = r; });
    let bonus = 0;
    if (!this.testsDone[st.id]) {
      bonus = st.quiz.reward;
      this.coins += bonus;
      this.testsDone[st.id] = { s: st.s, t: Date.now() };
      AudioFX.coin();
    } else AudioFX.success();
    this.save();
    this.screen = "result";
    Platform.stopGameplay();
    this.el(`${this.top(t("result"), "Game.showTests()")}
      <div class="scroll result"><div class="q-card">
        <div class="big">${tx(res.title)}</div>
        <div class="stars">${"★".repeat(Math.min(5, 1 + Math.floor(st.s / 10)))}</div>
        <p>${tx(res.text)}</p>
        <p class="badge gold" style="display:inline-block">${bonus ? t("coinsGot", { c: bonus }) : t("alreadyRewarded")}</p>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn" data-k="1" onclick="Game.startTest('${st.id}')">${t("again")}</button>
          <button class="btn sec" data-k="1" onclick="Game.showTests()">${t("tests")}</button>
        </div>
      </div></div>`);
    Platform.interstitial(() => {});
  },

  showPhotos() {
    AudioFX.click();
    this.screen = "photos";
    Platform.stopGameplay();
    const cards = CONTENT.PHOTOS.map((p) => {
      const open = !!this.unlocked[p.id];
      return `<button class="photo-card ${open ? "" : "locked"}" data-k="1" onclick="Game.openPhoto('${p.id}')">
        <img src="${p.src}" alt="">
        ${open ? "" : `<div class="lock-ico">🔒</div>`}
        <div class="meta"><span class="badge hot">${t("hot")}</span><span class="badge gold">${open ? "✓" : "✦ 50"}</span></div>
      </button>`;
    }).join("");
    this.el(`${this.top(t("photos"), "Game.showHome()")}
      <div class="scroll">
        <p class="muted" style="margin-top:0">${t("coinsHelp")}</p>
        <div class="photo-grid">${cards}</div>
      </div>`);
  },

  openPhoto(id) {
    AudioFX.click();
    const p = CONTENT.PHOTOS.find((x) => x.id === id);
    if (this.unlocked[id]) {
      this.screen = "photo";
      Platform.startGameplay();
      this.modal(`<div class="modal-card" style="text-align:center">
        <img src="${p.src}" alt="" style="width:100%;border-radius:12px;max-height:52vh;object-fit:contain">
        <h3>${tx(p.title)}</h3>
        <button class="btn sec" data-k="1" onclick="Game.closeModal();Game.showPhotos()">${t("close")}</button>
      </div>`);
      return;
    }
    this.modal(`<div class="modal-card">
      <div><span class="badge hot">${t("hot")}</span> <span class="badge gold">✦ 50</span></div>
      <h3>${tx(p.title)}</h3>
      <p class="muted">${t("rewardedHint")}</p>
      <button class="btn" style="width:100%;margin-top:8px" data-k="1" onclick="Game.buyPhoto('${id}')">${t("openFor")} 50</button>
      <button class="btn cyan" style="width:100%;margin-top:8px" data-k="1" onclick="Game.adPhoto('${id}')">${t("watchAd")}</button>
      <button class="btn sec" style="width:100%;margin-top:8px" data-k="1" onclick="Game.closeModal()">${t("close")}</button>
    </div>`);
  },

  unlockPhoto(id) {
    this.unlocked[id] = 1;
    this.save();
    AudioFX.success();
    this.toast(t("opened"));
    this.closeModal();
    this.showPhotos();
    this.openPhoto(id);
  },
  buyPhoto(id) {
    if (this.coins < CONTENT.PHOTO_PRICE) { this.toast(t("needCoins")); return; }
    this.coins -= CONTENT.PHOTO_PRICE;
    this.unlockPhoto(id);
  },
  adPhoto(id) {
    Platform.rewarded(() => this.unlockPhoto(id), () => this.toast(t("adFail")));
  },
  adCoins() {
    Platform.rewarded(() => {
      this.coins += CONTENT.AD_COINS;
      this.save();
      AudioFX.coin();
      this.toast(t("coinsGot", { c: CONTENT.AD_COINS }));
      if (this.screen === "profile") this.showProfile();
    }, () => this.toast(t("adFail")));
  },

  showChats() {
    AudioFX.click();
    this.screen = "chats";
    Platform.stopGameplay();
    const cards = CONTENT.GIRLS.map((g) => {
      const st = this.chats[g.id] || { done: false };
      return `<button class="card tg-item" data-k="1" onclick="Game.openChat('${g.id}')">
        <img class="avatar" src="${g.avatar}" alt="">
        <div style="min-width:0;flex:1;text-align:left">
          <div><b>${g.name}</b> · ${g.age} ${st.done ? "✓" : ""}</div>
          <div class="muted"><span class="dot"></span> ${t("online")} · ${g.job}</div>
          <div class="preview">${g.preview}</div>
        </div>
      </button>`;
    }).join("");
    this.el(`${this.top(t("chats"), "Game.showHome()")}
      <div class="scroll" style="display:flex;flex-direction:column;gap:6px;background:#0e1a22">${cards}</div>`);
  },

  openChat(id) {
    AudioFX.click();
    this.chatId = id;
    this.screen = "chat";
    Platform.startGameplay();
    if (!this.chats[id]) this.chats[id] = { i: 0, h: 0, log: [], done: false };
    const st = this.chats[id];
    if (!st.log.length) this.advanceNpc(id);
    this.renderChat();
  },

  advanceNpc(id) {
    const script = CONTENT.CHATS[id];
    const st = this.chats[id];
    while (st.i < script.length && script[st.i].her) {
      st.log.push({ who: "her", text: script[st.i].her });
      st.i++;
    }
    if (st.i >= script.length) st.done = true;
    this.save();
  },

  renderChat() {
    const id = this.chatId;
    const g = CONTENT.GIRLS.find((x) => x.id === id);
    const script = CONTENT.CHATS[id];
    const st = this.chats[id];
    const msgs = st.log.map((m) => `<div class="bubble ${m.who}">${m.text}</div>`).join("");
    let choices = "";
    if (st.i < script.length && script[st.i].opts) {
      choices = `<div class="choices">` + script[st.i].opts.map((op, i) =>
        `<button class="choice" data-k="1" onclick="Game.pickChat(${i})">${op.t}</button>`
      ).join("") + `</div>`;
    } else if (st.done) {
      choices = `<div class="choices"><div class="q-card" style="text-align:center">♥ ${st.h}<br><button class="btn" data-k="1" onclick="Game.showChats()">${t("chats")}</button></div></div>`;
    }
    this.el(`${this.top(g.name, "Game.showChats()")}
      <div class="tg">
        <div class="scroll" id="chatScroll"><div class="messages">${msgs}</div>${choices}</div>
      </div>`);
    const sc = document.getElementById("chatScroll");
    if (sc) sc.scrollTop = sc.scrollHeight;
  },

  pickChat(i) {
    AudioFX.message();
    const id = this.chatId;
    const script = CONTENT.CHATS[id];
    const st = this.chats[id];
    const op = script[st.i].opts[i];
    st.log.push({ who: "me", text: op.t });
    st.h += op.h || 0;
    st.i++;
    this.advanceNpc(id);
    this.renderChat();
    if (st.done) Platform.interstitial(() => {});
  },

  toggleMusic() {
    this.music = !this.music;
    AudioFX.setMusic(this.music);
    this.save();
    this.showProfile();
  },
  toggleSfx() {
    this.sfx = !this.sfx;
    AudioFX.setSfx(this.sfx);
    AudioFX.click();
    this.save();
    this.showProfile();
  },

  showProfile() {
    AudioFX.click();
    this.screen = "profile";
    Platform.stopGameplay();
    const chatsDone = Object.values(this.chats).filter((c) => c.done).length;
    const tests = Object.keys(this.testsDone).length;
    const photos = Object.keys(this.unlocked).length;
    this.el(`${this.top(t("profile"), "Game.showHome()")}
      <div class="scroll">
        <div class="stat-row">
          <div class="stat"><b>${this.coins}</b>${t("coins")}</div>
          <div class="stat"><b>${tests}/${CONTENT.QUIZZES.length}</b>${t("testsDone")}</div>
          <div class="stat"><b>${photos}/${CONTENT.PHOTOS.length}</b>${t("photosOpen")}</div>
          <div class="stat"><b>${chatsDone}/${CONTENT.GIRLS.length}</b>${t("chatsDone")}</div>
        </div>
        <p class="muted">${t("coinsHelp")}</p>
        <button class="btn gold" style="width:100%;min-height:52px;margin:8px 0" data-k="1" onclick="Game.adCoins()">${t("watchAdCoins")}</button>
        <p class="muted">${t("rewardedHint")}</p>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn sec" data-k="1" onclick="Game.toggleMusic()">${t("music")}: ${this.music ? "ON" : "OFF"}</button>
          <button class="btn sec" data-k="1" onclick="Game.toggleSfx()">${t("sfx")}: ${this.sfx ? "ON" : "OFF"}</button>
        </div>
        <div class="q-card" style="margin-top:12px"><b>${t("how")}</b><p class="muted">${t("howBody")}</p></div>
      </div>`);
  }
};

window.Game = Game;
Game.start().catch(function (e) {
  document.body.innerHTML = '<div style="padding:24px;color:#fff;font-family:sans-serif">Распакуйте архив целиком и откройте index.html из папки.<pre>' + (e && e.message ? e.message : e) + "</pre></div>";
});

  </script>
</body>
</html>
